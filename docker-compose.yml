services:
  postgres:
    image: postgres:16-alpine
    container_name: filemailer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"

  http-service:
    build:
      context: .
      dockerfile: Dockerfile.http
    container_name: filemailer-http
    depends_on:
      - postgres
    environment:
      DB_DSN: ${DB_DSN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE}
      YTDLP_COOKIES_PATH: ${YTDLP_COOKIES_PATH:-}
    ports:
      - "8080:8080"
    volumes:
      - ./http-logs:/logs
      # Опционально: когда есть файл cookies для Instagram, раскомментировать и в .env задать YTDLP_COOKIES_PATH=/cookies/instagram.txt
      - ./cookies/instagram.txt:/cookies/instagram.txt:ro

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: filemailer-bot
    depends_on:
      - http-service
      - telegram-bot-api
    environment:
      DB_DSN: ${DB_DSN}
      API_BASE: http://http-service:8080
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE}

volumes:
  pgdata:
  telegram-bot-api-data: