services:
  postgres:
    image: postgres:16-alpine
    container_name: filemailer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"

  http-service:
    build:
      context: .
      dockerfile: Dockerfile.http
    container_name: filemailer-http
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DSN: ${DB_DSN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE}
      YTDLP_COOKIES_PATH: ${YTDLP_COOKIES_PATH:-}
      INSTAGRAM_MIN_INTERVAL_SECONDS: ${INSTAGRAM_MIN_INTERVAL_SECONDS:-0}
      YTDLP_SLEEP_INTERVAL_SECONDS: ${YTDLP_SLEEP_INTERVAL_SECONDS:-0}
    ports:
      - "8080:8080"
    volumes:
      - ./http-logs:/logs
      # Для Instagram: создать cookies/instagram.txt, задать YTDLP_COOKIES_PATH в .env, раскомментировать следующую строку и перезапустить с --force-recreate
      # - ./cookies/instagram.txt:/cookies/instagram.txt:ro

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: filemailer-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      http-service:
        condition: service_started
      telegram-bot-api:
        condition: service_started
    environment:
      DB_DSN: ${DB_DSN}
      API_BASE: http://http-service:8080
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE}

volumes:
  pgdata:
  telegram-bot-api-data: